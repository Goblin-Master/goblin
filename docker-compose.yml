services:
  mysql:
    image: mysql:8.4
    container_name: goblin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: goblin
      MYSQL_USER: goblin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-goblin_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - goblin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  goblin_mysql_data:
