services:
  mysql:
    image: mysql:8.4
    container_name: goblin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: goblin
      MYSQL_USER: goblin
      # 本地开发统一密码；生产环境请改用独立凭据。
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - goblin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  goblin_mysql_data:
